.tools { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; z-index: 3; }
.ib { width: 42px; height: 42px; display: grid; place-items: center; padding: 0; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.34); background: var(--deep); color: #fff; cursor: pointer; font: 800 20px var(--display); }

    $('w-name').textContent = n.av + ' ' + n.u; $('walkbar').hidden = false; $('pad').hidden = false; fly = null; }
  function stopWalk() { if (!W) return; const n = W.n; n.walkHide = false; W = null; $('walkbar').hidden = true; $('pad').hidden = true; $('find').hidden = false; $('hud').hidden = false; $('tools').hidden = false; go(n); }
  $('b-walk').addEventListener('click', () => { const n = N.find(q => q.k === SEL); if (n) startWalk(n); });
  $('w-exit').addEventListener('click', stopWalk);
  window.addEventListener('keydown', e => { if (!W) return; const k = e.key.toLowerCase(); if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(k)) { keys.add(k); e.preventDefault(); } if (k === 'escape') stopWalk(); });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  const pad = $('pad'), knob = $('knob'); let pid = null;
  function padMove(e) { const r = pad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let dx = e.clientX - cx, dy = e.clientY - cy; const L = Math.hypot(dx, dy), M = r.width / 2 - 20; if (L > M) { dx *= M / L; dy *= M / L; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; stick[0] = dx / M; stick[1] = dy / M; }
  pad.addEventListener('pointerdown', e => { pid = e.pointerId; pad.setPointerCapture(pid); padMove(e); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) padMove(e); });
  const padUp = e => { if (e.pointerId !== pid) return; pid = null; stick[0] = stick[1] = 0; knob.style.transform = ''; }; pad.addEventListener('pointerup', padUp); pad.addEventListener('pointercancel', padUp);
  let last = 0;
  function walkTick(now) { const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    if (W) { let sx = stick[0], sy = stick[1]; if (keys.has('arrowleft') || keys.has('a')) sx -= 1; if (keys.has('arrowright') || keys.has('d')) sx += 1; if (keys.has('arrowup') || keys.has('w')) sy -= 1; if (keys.has('arrowdown') || keys.has('s')) sy += 1;
      const m = Math.min(1, Math.hypot(sx, sy)); W.moving = m > 0.12 ? 1 : 0;
      if (W.moving) { const L = Math.hypot(sx, sy) || 1, ux = sx / L, uy = sy / L, dvi = ux / TW + uy / TH, dvj = uy / TH - ux / TW, nn = Math.hypot(dvi, dvj) || 1, sp = 3.2 * m * dt;   // a screen direction, in tiles of the view
        const v = V(W.i, W.j), tryGo = (a, b) => { const w = unV(v[0] + a, v[1] + b); if (!blocked(w[0], w[1])) { W.i = w[0]; W.j = w[1]; return true; } return false; };
        if (!tryGo(dvi / nn * sp, dvj / nn * sp)) { if (!tryGo(dvi / nn * sp, 0)) tryGo(0, dvj / nn * sp); }
        if (Math.abs(ux) > 0.15) W.side = ux > 0 ? 1 : -1; W.ph += dt; }
      const p = P(W.i, W.j, 0.8), z = 2.9; cam.z += (z - cam.z) * Math.min(1, dt * 4); cam.x += (p[0] - cam.x) * Math.min(1, dt * 6); cam.y += (p[1] + 60 / cam.z - cam.y) * Math.min(1, dt * 6); }
    requestAnimationFrame(walkTick); }
  requestAnimationFrame(walkTick);
  window.EXTRA = (items, t) => { if (!W) return; const n = W.n, i = W.i, j = W.j, p = P(i, j), wst = W.moving ? Math.sin(W.ph * 9) : 0;
    items.push({ d: depth(i, j) + 0.01, f: () => { ctx.save(); ctx.fillStyle = 'rgba(255,210,90,.55)'; ctx.beginPath(); ctx.ellipse(p[0], p[1], 15, 7, 0, 0, 7); ctx.fill(); ctx.translate(p[0], p[1] - Math.abs(wst) * 0.8); ctx.scale(RES, RES);
      if (n.kind === 'human') person(0, 0, n.look, t, W.moving ? { pose: 'walk', side: W.side, job: n.job } : { wave: true, job: n.job });
      else { if (W.moving) { ctx.rotate(wst * 0.05); if (n.kind !== 'emoji') ctx.scale(W.side, 1); } if (n.kind === 'emoji') glyph(n.av, 0, 0, t, n.seed, n.job); else animal(n.kind, 0, 0, t, { wave: !W.moving, job: n.job, walk: wst }); }
      ctx.restore(); } }); };
  let first = ''; try { first = decodeURIComponent((location.hash || '').replace(/^#@?/, '')); } catch (e) {}
  if (first) { $('q').value = first; setTimeout(() => find(first), 400); } else say(text(['Type your Instagram username to find your house 🏡']), 7000);
})();
